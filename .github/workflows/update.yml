name: レシピ更新＆自動公開

on:
  schedule:
    - cron: "0 21 * * 0"   # 毎週 日曜21:00 UTC（＝月曜6:00 JST）に自動収集
  workflow_dispatch: {}      # 手動で「今すぐ更新」も可能
  push:
    branches: [ main ]        # コード更新のたびに再公開

permissions:
  contents: write   # recipes.json のコミットに必要
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python 準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: レシピ収集（crawl.py）
        run: python3 crawl.py

      - name: recipes.json の更新をコミット（失敗しても公開は続行）
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recipes.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: recipes.json 自動更新"
            git pull --rebase --autostash origin main || true
            git push || echo "push はスキップ（次回反映されます）"
          fi

      - name: 公開フォルダを作成（配信ファイルのみ）
        run: |
          mkdir -p _site
          # 配信に必要なファイル種別をまとめてコピー（crawl.py等は含まれない）
          cp *.html *.css *.js *.json *.webmanifest *.svg robots.txt _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "=== _site 内容 ===" && ls -1 _site

      - name: Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages へデプロイ
        id: deploy
        uses: actions/deploy-pages@v4
